services:

  eureka-server:
    container_name: eureka-server
    image: eureka-server
    ports:
      - "8761:8761"
    networks:
      - genealogy-net

  genealogy-app:
    container_name: genealogy-app
    image: genealogy-app
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      SERVER_TOMCAT_MAX_SWALLOW_SIZE: -1
      FILE_STORAGE: /upload-dir
    ports:
      - "8080:8080"
    volumes:
      - ./upload-dir:/upload-dir
    depends_on:
      - neo4j
      - eureka-server
    networks:
      - genealogy-net

  app-reactive:
    container_name: genealogy-app-reactive
    image: app-reactive
    environment:
      _JAVA_OPTIONS: "-Xms256m -Xmx6g"
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      SERVER_TOMCAT_MAX_SWALLOW_SIZE: -1
      FILE_STORAGE: /upload-dir
    ports:
      - "8082:8082"
    volumes:
      - ./upload-dir:/upload-dir
    depends_on:
      - neo4j
      - eureka-server
    networks:
      - genealogy-net

  app-user:
    container_name: genealogy-app-user
    image: app-user
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/genealogydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - eureka-server
    networks:
      - genealogy-net

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: genealogydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data7:/var/lib/postgresql/data
    networks:
      - genealogy-net

  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/password1234
      NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: "4G"
      NEO4J_server_memory_heap_initial__size: "4G"
      NEO4J_server_memory_heap_max__size: "12G"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4j_server_bolt_listen_address: ":7687"
      NEO4j_server_http_listen_address: ":7474"
      apoc.export.file.enabled: "true"
      apoc.import.file.enabled: "true"
      apoc.import.file.use_neo4j_config: "true"


    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data7:/data
      - ./plugins:/plugins
      - ./upload-dir:/upload-dir
    networks:
      - genealogy-net

volumes:
  neo4j_data7:
  postgres_data7:

networks:
  genealogy-net:
    driver: bridge
