spring.application.name=genealogy-app

spring.neo4j.uri=bolt://localhost:7688
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password1234
secret.key=secretkey123
file.storage=/upload-dir

logging.level.org.springframework.data.neo4j.cypher.deprecation=OFF

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.web.resources.static-locations=file:/upload-dir/
file.upload.base-url=http://localhost:8080/upload-dir/


spring.servlet.multipart.enabled=true

server.port=8080

spring.cache.type=caffeine

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.threads.virtual.enabled=true

